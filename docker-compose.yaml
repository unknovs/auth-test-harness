version: '3.8'

services:
  auth-test-harness:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: "localhost:8080"
      BASIC_AUTH_VALUE: "dGVzdDp0ZXN0" # base64 for test:test
      AUTHORIZATION_ENDPOINT: "/trustedx-authserver/oauth/lvrtc-eipsign-as"
      TOKEN_ENDPOINT: "/trustedx-authserver/oauth/lvrtc-eipsign-as/token"
      USERINFO_ENDPOINT: "/trustedx-resources/openid/v1/users/me"
      # The identity provider's logout: the browser is sent here with a
      # redirect_uri and is sent back to it.
      LOGOUT_ENDPOINT: "/trustedx-authserver/lvrtc-eipsign-idp/logout"
      SCOPES_SUPPORTED: "urn:lvrtc:fpeil:aa"
      # The eParaksts-shaped flows, plus the two directory flows: a work account at
      # the person's organisation (a member of its directory) and the same person
      # as a guest of it. A directory profile carries no identity code.
      ACR_VALUES_SUPPORTED: "urn:eparaksts:authentication:flow:mobileid,urn:eparaksts:authentication:flow:sc_plugin,urn:eparaksts:authentication:flow:mobile-eid,urn:auth-test-harness:flow:directory,urn:auth-test-harness:flow:directory-guest"
      SERIAL_NUMBER: "PNOLV-111111-11111"
      MOBILE_GIVEN_NAME: "Jane"
      MOBILE_FAMILY_NAME: "Mobile"
      SC_GIVEN_NAME: "John"
      SC_FAMILY_NAME: "Cardreader"
      EIDSCAN_GIVEN_NAME: "Erik"
      EIDSCAN_FAMILY_NAME: "Scanner"
      # Give a profile its own identity code to represent a SECOND person — the
      # counterparty in a sharing or co-signing flow. Drop this line and every
      # method reports the same person.
      EIDSCAN_SERIAL_NUMBER: "PNOLV-222222-22222"
      # The directory user: a name and a durable object id (derived from the names
      # when unset), never an identity code.
      DIRECTORY_GIVEN_NAME: "Ilze"
      DIRECTORY_FAMILY_NAME: "Ozola"

    restart: unless-stopped

  # The same service with an identity list: Mobile ID and eID Scan ask for a
  # personal code and answer as the person the list names for it; the smart card
  # keeps its configured profile. With no IDENTITIES_FILE it uses the built-in
  # list of twenty made-up people, PNOLV-000123-00001 to -00020.
  auth-test-harness-list:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      HOST: "localhost:8081"
      BASIC_AUTH_VALUE: "dGVzdDp0ZXN0" # base64 for test:test
      AUTHORIZATION_ENDPOINT: "/trustedx-authserver/oauth/lvrtc-eipsign-as"
      TOKEN_ENDPOINT: "/trustedx-authserver/oauth/lvrtc-eipsign-as/token"
      USERINFO_ENDPOINT: "/trustedx-resources/openid/v1/users/me"
      LOGOUT_ENDPOINT: "/trustedx-authserver/lvrtc-eipsign-idp/logout"
      SCOPES_SUPPORTED: "urn:lvrtc:fpeil:aa"
      ACR_VALUES_SUPPORTED: "urn:eparaksts:authentication:flow:mobileid,urn:eparaksts:authentication:flow:sc_plugin,urn:eparaksts:authentication:flow:mobile-eid"
      SERIAL_NUMBER: "PNOLV-111111-11111"
      SC_GIVEN_NAME: "John"
      SC_FAMILY_NAME: "Cardreader"
      USED_IDENTITIES: "list"
      # Your own people instead: name the file, and mount its DIRECTORY (an
      # editor that saves by replacing the file would leave a single-file mount
      # on the old one). An edit is picked up at the next login, no restart.
      # IDENTITIES_FILE: "/identities/identities.json"
    # volumes:
    #   - ./my-identities:/identities:ro

    restart: unless-stopped
